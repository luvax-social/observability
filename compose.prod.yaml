# Coolify "Docker Compose Empty" resource: the core luvax-observability resource.
# Every bind mount is an absolute host path under /data/luvax/observability, which R1 of the
# production runbook populates by running scripts/sync-to-host.sh; there is no repo checkout on
# the host for Coolify to resolve a relative path against.
#
# As of the Phase 1.5 resource split, this file holds only the core services: ClickHouse,
# Prometheus, Grafana, the OTel Collector, the Docker socket proxy, and the blackbox exporter.
# The five exporters that used to live here (postgres-exporter, redis-exporter,
# elasticsearch-exporter, node-exporter, cadvisor) now live in their own Coolify resources, each
# from its own compose file in this repository (compose.host.prod.yaml,
# compose.postgres-exporter.prod.yaml, compose.redis-exporter.prod.yaml,
# compose.elasticsearch-exporter.prod.yaml). See docs/production-deployment-runbook.md, "Phase 1.5" runbook.
services:
  clickhouse:
    # Pinned to the 26.3 LTS line. From 26.6 the official build targets x86-64-v3 (AVX2); the
    # production host's CPU has no AVX2, and 26.8.10.6 was reproduced crashing with SIGILL there.
    # Do not move past 26.5 on this host (see section 2 of the observability plan).
    image: clickhouse/clickhouse-server:26.3.33.24
    restart: unless-stopped
    mem_limit: 4096m
    cpus: 0.70
    ulimits:
      nofile: 262144
    environment:
      CLICKHOUSE_USER: otel_writer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_OTEL_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
      # Read by clickhouse/initdb/02-create-analytics.sh, from initdb on an empty volume and from
      # docker exec on an existing one, so no password ever appears on a command line.
      CLICKHOUSE_ANALYTICS_WRITER_PASSWORD: ${CLICKHOUSE_ANALYTICS_WRITER_PASSWORD}
      CLICKHOUSE_ANALYTICS_READER_PASSWORD: ${CLICKHOUSE_ANALYTICS_READER_PASSWORD}
      CLICKHOUSE_ANALYTICS_MIGRATOR_PASSWORD: ${CLICKHOUSE_ANALYTICS_MIGRATOR_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - /data/luvax/observability/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      # Not read-only: the official entrypoint writes users.d/default-user.xml here at first boot
      # to disable the "default" user in favour of CLICKHOUSE_USER, and fails to start without
      # write access to this directory.
      - /data/luvax/observability/clickhouse/users.d:/etc/clickhouse-server/users.d
      - /data/luvax/observability/clickhouse/initdb:/docker-entrypoint-initdb.d:ro

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 0.40
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
      - /data/luvax/observability/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - /data/luvax/observability/prometheus/targets/prod:/etc/prometheus/targets:ro

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    expose:
      - "3000"
    environment:
      GF_SERVER_ROOT_URL: https://grafana.luvax.online/
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      # contact-points.yaml requires a syntactically valid, non-empty URL: Grafana's discord
      # contact point fails provisioning validation on an empty one, and that failure is fatal to
      # the whole server, not just to alerting. R5 deploys this resource before R9 sets the real
      # webhook, so without a placeholder default Grafana would crash-loop from first deploy until
      # R9 runs. The placeholder domain never resolves, so a rule that fires in that window just
      # fails its HTTP send silently.
      GF_DISCORD_WEBHOOK_URL: ${GF_DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/000000000000000000/placeholder-pending-r9}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.21.3
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
      PG_STATS_HOST: ${PG_STATS_HOST}
      PG_STATS_DATABASE: ${PG_STATS_DATABASE}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - /data/luvax/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - /data/luvax/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - /data/luvax/observability/dashboards:/etc/grafana/dashboards:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    user: "0"
    labels:
      luvax.logs.exclude: "true"
    environment:
      CLICKHOUSE_OTEL_PASSWORD: ${CLICKHOUSE_OTEL_PASSWORD}
      BACKEND_COOLIFY_RESOURCE_NAME: ${BACKEND_COOLIFY_RESOURCE_NAME}
      LOG_CONTAINER_POSTGRES: ${LOG_CONTAINER_POSTGRES}
      LOG_CONTAINER_REDIS: ${LOG_CONTAINER_REDIS}
      LOG_CONTAINER_RABBITMQ: ${LOG_CONTAINER_RABBITMQ}
      LOG_CONTAINER_ELASTICSEARCH: ${LOG_CONTAINER_ELASTICSEARCH}
      LOG_CONTAINER_GORSE: ${LOG_CONTAINER_GORSE}
      DEPLOYMENT_ENVIRONMENT: prod
    volumes:
      - otelcol-storage:/var/lib/otelcol/storage
      - /data/luvax/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - docker-socket-proxy
      - clickhouse

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.05
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      # New in Phase 1.5: Prometheus's docker_sd_configs job (see prometheus/prometheus.prod.yml)
      # calls the Docker networks API to compute __meta_docker_network_* labels for every
      # discovered container. Without this, discovery fails with an HTTP 403 from the proxy.
      # Verified locally (section 2 of the P1.5-A plan, and again in this task's own rehearsal).
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  blackbox-exporter:
    # New in Phase 1.5: probes the Coolify proxy's origin TLS certificate per hostname. See
    # docs/production-deployment-runbook.md, "Phase 1.5" runbook and section 9, for the Cloudflare Access
    # ACME-bypass gotcha this alert is meant to catch.
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.02
    volumes:
      - /data/luvax/observability/blackbox-exporter/config.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

volumes:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  otelcol-storage:
