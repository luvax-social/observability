# Coolify "Docker Compose Empty" resource: luvax-redis-exporter.
# Split out of the core compose.prod.yaml in Phase 1.5, so a Redis credential rotation only ever
# touches this resource. See docs/production-deployment-runbook.md, "Phase 1.5" runbook.
#
# The label below is opt-in scrape discovery for the core resource's Prometheus, which finds this
# container through the docker-socket-proxy via docker_sd_configs (see
# prometheus/prometheus.prod.yml, job luvax-exporters). This resource must be attached to the
# shared "coolify" network (Coolify's "Connect To Predefined Network" toggle) for Prometheus to
# resolve it by container name, and to reach the Redis resource by its own container name.
services:
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.05
    labels:
      luvax.prometheus.scrape: "true"
      luvax.prometheus.job: "redis"
      luvax.prometheus.port: "9121"
    environment:
      REDIS_ADDR: redis://ijrhuhxwedr7y0pmjhputc5f:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
