global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: luvax-backend
    file_sd_configs:
      - files: ["/etc/prometheus/targets/backend.yml"]
    metrics_path: /actuator/prometheus

  - job_name: rabbitmq
    file_sd_configs:
      - files: ["/etc/prometheus/targets/rabbitmq.yml"]
    metrics_path: /metrics

  - job_name: rabbitmq-queues
    file_sd_configs:
      - files: ["/etc/prometheus/targets/rabbitmq.yml"]
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]

  - job_name: gorse
    file_sd_configs:
      - files: ["/etc/prometheus/targets/gorse.yml"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
