apiVersion: 1
# Phase 1.5 adds a nested route for severity=critical. Previously every alert, regardless of
# severity, shared one 4-hour repeat interval. A critical alert (disk full, a scrape target down,
# a restart loop) left unacknowledged for four hours between reminders is a long silence for
# something already labeled critical; warning-level alerts keep the 4-hour default, since they are
# already individually actionable the moment they first fire.
policies:
  - orgId: 1
    receiver: discord
    group_by: ["alertname", "job", "queue", "name"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord
        object_matchers:
          - ["severity", "=", "critical"]
        group_by: ["alertname", "job", "queue", "name"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
