apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana_reader
      defaultDatabase: otel
      logs:
        defaultDatabase: otel
        defaultTable: otel_logs
        otelEnabled: true
        otelVersion: latest
        showLogLinks: true
      traces:
        defaultDatabase: otel
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: latest
        showTraceLinks: true
        durationUnit: nanoseconds
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
  - name: PostgreSQL statistics
    uid: postgres-stats
    type: grafana-postgresql-datasource
    url: ${PG_STATS_HOST}:5432
    user: luvax_monitor
    jsonData:
      database: ${PG_STATS_DATABASE}
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: ${POSTGRES_MONITOR_PASSWORD}
