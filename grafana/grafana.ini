[server]
# root_url and [security] cookie_secure are set per environment through the GF_SERVER_ROOT_URL
# and GF_SECURITY_COOKIE_SECURE environment variables in each compose file, because the two
# environments need different values and Grafana's env-var overrides take precedence over this
# file without needing a second copy of it.
protocol = http
http_port = 3000

[security]
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[metrics]
enabled = true
